spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/employees}
    username: ${SPRING_DATASOURCE_USERNAME:employees}
    password: ${SPRING_DATASOURCE_PASSWORD:employees}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jackson:
    default-property-inclusion: non_null
app:
  jwt:
    secret: ${JWT_SECRET:change-this-local-development-secret-key-to-at-least-32-characters}
    expiration-ms: 28800000
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
