services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-employees}
      POSTGRES_USER: ${POSTGRES_USER:-employees}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-employees}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-employees}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-employees}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-employees}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-employees}
      JWT_SECRET: ${JWT_SECRET:-change-this-local-development-secret-key-to-at-least-32-characters}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SPRING_PROFILES_ACTIVE: demo
    depends_on:
      db:
        condition: service_healthy
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:80"]

volumes:
  postgres_data:

